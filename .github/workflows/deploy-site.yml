name: Deploy site

# A merge into main is a deploy: no approval step in between. Run it by hand
# (Actions → Deploy site → Run workflow, on main) to redeploy. Roll back by reverting the PR: the revert's merge
# redeploys the previous version.
on:
  push:
    branches: [main]
    paths: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in merge order. Runs queue rather than cancel; if several queue up, GitHub keeps only the
# newest, which deploys the latest main.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # Only main goes live, even when someone runs it by hand on another branch.
    if: github.ref == 'refs/heads/main'
    # The Cloudflare token lives in the `production` environment, whose deployment branches are main only: a workflow
    # run from any other branch (or a changed copy of this file there) never gets it.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - run: npm test --prefix worker
      - name: Deploy to imorchy.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=No Cloudflare token::Add the CLOUDFLARE_API_TOKEN secret to the production environment (Settings → Environments → production)."
            exit 1
          fi
          node deploy.mjs imorchy.dev
      - name: Check the live site
        run: node worker/check-live.mjs imorchy.dev
