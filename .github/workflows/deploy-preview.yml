name: Deploy preview

# Every push to a feat/site-v4-* branch deploys that branch to the separate Worker imorchy-site-preview on
# workers.dev (https://imorchy-site-preview.janmm97.workers.dev), never to imorchy.dev. The newest push wins.
# The token lives in the `preview` environment, whose deployment branches are feat/site-v4-* only; it can write
# Workers scripts and nothing else. Every answer of the preview says X-Robots-Tag: noindex, nofollow.
on:
  push:
    branches: ["feat/site-v4-*"]

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/heads/feat/site-v4-')
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://imorchy-site-preview.janmm97.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - run: npm test --prefix worker
      - name: Deploy to the preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 19b3966fdcb5b394daf54db2a8373474
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=No Cloudflare token::Add CLOUDFLARE_API_TOKEN to the preview environment."
            exit 1
          fi
          node deploy.mjs --preview
      - name: Check the preview answers
        # workers.dev can take a minute to route a newly enabled script.
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/")
            [ "$code" = 200 ] && break
            echo "/ answered $code, retrying"; sleep 10
          done
          [ "$code" = 200 ] || { echo "::error::$PREVIEW_URL/ answered $code"; exit 1; }
          curl -sI "$PREVIEW_URL/" | grep -i '^x-robots-tag: noindex, nofollow' || { echo "::error::no X-Robots-Tag noindex"; exit 1; }
          for p in /local /claude-code-orchestrator; do
            curl -s -o /dev/null -w "$p %{http_code} %{redirect_url}\n" "$PREVIEW_URL$p" | grep -E ' 301 https://imorchy.dev/$' || { echo "::error::$p is not a 301 to /"; exit 1; }
          done
          curl -s -o /dev/null -w '/go/early-access %{http_code} %{redirect_url}\n' "$PREVIEW_URL/go/early-access?from=hero" | grep -E ' 302 https://app.imorchy.dev/\?from=hero$' || { echo "::error::CTA hop broken"; exit 1; }
          curl -s "$PREVIEW_URL/robots.txt" | grep -x 'Disallow: /go/' || { echo "::error::robots.txt has no Disallow: /go/"; exit 1; }
          echo "Preview OK: $PREVIEW_URL"
