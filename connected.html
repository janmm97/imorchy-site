<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Back to Orchy</title>
    <meta name="theme-color" content="#080a0d" />
    <link rel="icon" href="assets/orchy-main.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/connected.mjs"></script>
  </head>
  <body class="popup-page">
    <main class="popup-card" aria-labelledby="popupTitle" aria-live="polite">
      <span class="popup-mark" id="mark" aria-hidden="true">✓</span>
      <p class="popup-kicker"><span class="status-dot"></span> ORCHY / PLAYGROUND</p>
      <h1 id="popupTitle">Heading back to Orchy</h1>
      <p id="message">One moment.</p>
      <div class="popup-actions" id="actions" hidden>
        <button type="button" class="button button-mint button-small" id="close">Close this window</button>
        <a class="button button-outline button-small" href="/#how">Back to Orchy</a>
      </div>
    </main>
  </body>
</html>
